<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embaixada</title>
</head>
<body>
    <h1>Sistema de Nacionalidade</h1>
    Qual o seu país de nascimento? <input type="text" name="txt1" id="txt1">
    <input type="button" value="Enviar" onclick="pass()">
    <div id="res">

    </div>
    <script>
        function pass(){
            var pais = window.document.getElementById('txt1').value
            /* var res = window.document.getElementById('res') 
            Por haver somente um "res" não há a necessidade de se criar uma variavel
            */
            res.innerHTML = `<p>Você nasceu no <strong>${pais}.</strong></p>`
            if (pais.toLowerCase() != 'brasil'){
                res.innerHTML += '<p>Você é <strong>Estrangeiro!</strong></p>'
            }else{
                res.innerHTML += '<p>Você é <strong>Brasileiro!</strong></p>'
            }
        }
    </script>
</body>
</html>
